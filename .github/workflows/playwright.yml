name: ParaBank Playwright

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui:
    name: UI (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Install browser
        run: python -m playwright install --with-deps ${{ matrix.browser }}
      - name: Run UI tests
        run: |
          mkdir -p reports
          pytest -v -m "ui and not stateful" --browser ${{ matrix.browser }} --html=reports/report-${{ matrix.browser }}.html --self-contained-html
          pytest -v -m stateful --browser ${{ matrix.browser }} --html=reports/stateful-${{ matrix.browser }}.html --self-contained-html
      - name: Upload report and failure artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ matrix.browser }}
          path: |
            reports/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  api:
    name: REST API
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Run API tests
        run: |
          mkdir -p reports
          pytest -v -m api --html=reports/api-report.html --self-contained-html
      - name: Upload API report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-api
          path: reports/api-report.html
          if-no-files-found: ignore
          retention-days: 14
